<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0B0F19"/>
  
  <!-- Subtle Grid Pattern Background -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1" stroke-opacity="0.6"/>
    </pattern>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#grid)" />
  <circle cx="950" cy="180" r="320" fill="url(#blueGlow)" filter="blur(80px)" />
  <circle cx="200" cy="500" r="260" fill="url(#blueGlow)" filter="blur(90px)" />

  <!-- NexGrid Logo & Brand Kicker -->
  <g transform="translate(100, 100)">
    <rect width="56" height="56" rx="14" fill="#0284C7"/>
    <path d="M 18 28 L 26 36 L 40 20" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="74" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">NexGrid<tspan fill="#38BDF8">.</tspan></text>
  </g>

  <!-- Tagline Pill -->
  <g transform="translate(100, 190)">
    <rect width="360" height="38" rx="19" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <circle cx="24" cy="19" r="5" fill="#38BDF8"/>
    <text x="40" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#94A3B8" letter-spacing="1">MODERN WEB ENGINEERING STUDIO</text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" fill="url(#textGrad)" letter-spacing="-1.5">
    Fast, Bespoke Websites
  </text>
  <text x="100" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" fill="#F8FAFC" letter-spacing="-1.5">
    That Grow Your Business.
  </text>

  <!-- Subtitle -->
  <text x="100" y="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#94A3B8">
    Guaranteed fixed quotes · 100% code ownership · 2–4 week launches.
  </text>

  <!-- Metrics / Features Bar -->
  <g transform="translate(100, 490)">
    <rect width="1000" height="80" rx="16" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
    
    <g transform="translate(40, 26)">
      <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#38BDF8">&lt; 0.5s</text>
      <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748B">PAGE LOAD SPEED</text>
    </g>

    <line x1="260" y1="18" x2="260" y2="62" stroke="#1E293B" stroke-width="1.5"/>

    <g transform="translate(300, 26)">
      <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">100% Ownership</text>
      <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748B">ZERO VENDOR LOCK-IN</text>
    </g>

    <line x1="560" y1="18" x2="560" y2="62" stroke="#1E293B" stroke-width="1.5"/>

    <g transform="translate(600, 26)">
      <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">Telebirr &amp; Chapa</text>
      <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748B">LOCAL PAYMENT READY</text>
    </g>

    <line x1="840" y1="18" x2="840" y2="62" stroke="#1E293B" stroke-width="1.5"/>

    <g transform="translate(870, 26)">
      <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#10B981">Fixed Quote</text>
      <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748B">UPFRONT PRICING</text>
    </g>
  </g>
</svg>
