<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Deep Navy / Sapphire Blue Gradient for 'N' -->
    <linearGradient id="nGradient" x1="120" y1="130" x2="260" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="45%" stop-color="#1D4ED8" />
      <stop offset="85%" stop-color="#0F2D6B" />
      <stop offset="100%" stop-color="#0B1D47" />
    </linearGradient>

    <!-- Vibrant Cyan / Teal Gradient for 'G' -->
    <linearGradient id="gGradient" x1="220" y1="130" x2="410" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="25%" stop-color="#06B6D4" />
      <stop offset="70%" stop-color="#0891B2" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>

    <!-- Metallic bevel highlights -->
    <linearGradient id="nHighlight" x1="100" y1="140" x2="200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1E40AF" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="gHighlight" x1="250" y1="140" x2="380" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.7" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="logoShadow" x="-15%" y="-15%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B192C" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#logoShadow)">
    <!-- BACK/INTERLOCK LAYER: 'G' Top Arch Arc -->
    <path
      d="M 270 248 C 265 190 310 142 376 142 C 435 142 478 185 478 244 C 478 266 470 286 458 300 L 418 274 C 424 266 428 255 428 244 C 428 214 404 188 374 188 C 342 188 318 214 316 248 Z"
      fill="url(#gGradient)"
    />

    <!-- 'N' MAIN BODY -->
    <!-- Left peak, descending diagonal, sharp bottom point, ascending diagonal to right -->
    <path
      d="M 194 142 L 254 366 L 202 366 L 164 212 L 128 366 L 76 366 L 148 142 Z"
      fill="url(#nGradient)"
    />
    <!-- 'N' Outer dynamic wing/blade (the stylized folded left loop) -->
    <path
      d="M 148 142 L 194 142 L 132 366 C 114 366 92 342 82 320 C 72 296 74 250 94 200 Z"
      fill="url(#nGradient)"
      opacity="0.9"
    />
    <!-- 'N' Right leg interlock spear -->
    <path
      d="M 194 142 L 238 270 L 268 180 C 250 156 226 144 194 142 Z"
      fill="url(#nHighlight)"
      opacity="0.4"
    />

    <!-- 'G' LOWER ARC & CROSSBAR -->
    <!-- Sweeps down, curves up into the crossbar shelf, with the inner cut-channel -->
    <path
      d="M 458 300 C 442 340 404 368 358 368 C 298 368 252 322 250 262 L 298 262 C 300 294 324 322 358 322 C 382 322 404 308 416 286 L 362 286 L 362 246 L 476 246 L 476 270 C 476 280 472 292 466 304 Z"
      fill="url(#gGradient)"
    />

    <!-- 'G' Spur/Terminal Arrow Accent -->
    <path
      d="M 426 246 L 476 246 L 476 290 L 438 290 L 438 274 L 426 274 Z"
      fill="url(#gHighlight)"
    />

    <!-- INNER EMBOSSED BEVEL TRACKS (gives the distinct brushed metal precision groove from the logo) -->
    <!-- 'N' inner groove -->
    <path
      d="M 152 165 L 182 165 L 126 348 C 112 334 100 306 102 278 C 104 246 122 198 152 165 Z"
      fill="none"
      stroke="#60A5FA"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.6"
    />
    <path
      d="M 188 170 L 236 342 L 210 342 L 168 214"
      fill="none"
      stroke="#93C5FD"
      stroke-width="4.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.5"
    />

    <!-- 'G' inner groove -->
    <path
      d="M 374 166 C 418 166 452 198 454 242"
      fill="none"
      stroke="#A5F3FC"
      stroke-width="5"
      stroke-linecap="round"
      opacity="0.75"
    />
    <path
      d="M 444 314 C 426 338 396 348 360 348 C 316 348 278 316 274 270"
      fill="none"
      stroke="#67E8F9"
      stroke-width="5"
      stroke-linecap="round"
      opacity="0.65"
    />
    <path
      d="M 380 266 L 452 266"
      fill="none"
      stroke="#A5F3FC"
      stroke-width="4"
      stroke-linecap="round"
      opacity="0.8"
    />
  </g>
</svg>
