<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Deep Navy / Royal Blue gradient for N -->
    <linearGradient id="nPrimary" x1="80" y1="120" x2="250" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="35%" stop-color="#1D4ED8" />
      <stop offset="70%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Teal / Cyan gradient for G -->
    <linearGradient id="gPrimary" x1="220" y1="110" x2="440" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="25%" stop-color="#06B6D4" />
      <stop offset="65%" stop-color="#0891B2" />
      <stop offset="100%" stop-color="#0E7490" />
    </linearGradient>

    <!-- Luminous accent cyan for G inner channel -->
    <linearGradient id="gAccent" x1="260" y1="140" x2="430" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A5F3FC" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>

    <!-- Luminous accent blue for N inner channel -->
    <linearGradient id="nAccent" x1="100" y1="140" x2="230" y2="370" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Subtle drop shadow -->
    <filter id="logoDepth" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#030712" flood-opacity="0.22" />
    </filter>
  </defs>

  <g filter="url(#logoDepth)">
    <!-- ==================== G BACKGROUND ARC ==================== -->
    <!-- Top arch of G curving from N's junction -->
    <path
      d="M 235 255 C 235 185 285 130 355 130 C 418 130 460 172 460 235 C 460 252 455 268 446 280 L 406 256 C 411 249 414 242 414 235 C 414 200 388 174 355 174 C 320 174 290 202 284 240 Z"
      fill="url(#gPrimary)"
    />

    <!-- ==================== N MONOGRAM ==================== -->
    <!-- N Left Outer Blade / Wing -->
    <path
      d="M 160 110 L 195 110 L 126 385 C 108 385 88 365 78 340 C 66 312 70 262 92 208 Z"
      fill="url(#nPrimary)"
    />

    <!-- N Left Inner Cutout (Negative Space) -->
    <path
      d="M 152 145 L 180 145 L 128 355 C 114 345 102 320 102 290 C 104 255 120 205 152 145 Z"
      fill="#ffffff"
      opacity="0.08"
    />

    <!-- N Center Diagonal Stem down to acute vertex -->
    <path
      d="M 195 110 L 246 395 L 202 395 L 158 225 L 126 385 L 78 385 L 160 110 Z"
      fill="url(#nPrimary)"
    />

    <!-- N Right Diagonal ascending leg (overlaps G) -->
    <path
      d="M 202 395 L 246 395 L 296 230 C 285 240 272 250 258 258 Z"
      fill="url(#nPrimary)"
    />

    <!-- N Bevel Highlight Line -->
    <path
      d="M 164 125 L 188 125 L 122 370"
      stroke="url(#nAccent)"
      stroke-width="3"
      stroke-linecap="round"
      opacity="0.7"
      fill="none"
    />
    <path
      d="M 195 128 L 240 380 L 210 380 L 168 220"
      stroke="url(#nAccent)"
      stroke-width="3.5"
      stroke-linecap="round"
      opacity="0.6"
      fill="none"
    />

    <!-- ==================== G FOREGROUND SWEEP ==================== -->
    <!-- Bottom & Right Arc of G -->
    <path
      d="M 446 280 C 430 326 392 360 345 360 C 282 360 234 314 232 250 L 278 250 C 280 288 308 316 345 316 C 372 316 396 300 408 276 L 350 276 L 350 232 L 460 232 L 460 256 C 460 265 455 273 446 280 Z"
      fill="url(#gPrimary)"
    />

    <!-- G Spur / Crossbar block -->
    <path
      d="M 412 232 L 460 232 L 460 274 L 424 274 L 424 258 L 412 258 Z"
      fill="url(#gPrimary)"
    />

    <!-- ==================== G INNER CHANNELS & HIGHLIGHTS ==================== -->
    <!-- Concentric upper channel -->
    <path
      d="M 355 152 C 404 152 438 184 440 228"
      stroke="url(#gAccent)"
      stroke-width="4"
      stroke-linecap="round"
      opacity="0.85"
      fill="none"
    />

    <!-- Concentric lower channel -->
    <path
      d="M 432 298 C 414 326 384 338 346 338 C 304 338 266 306 260 262"
      stroke="url(#gAccent)"
      stroke-width="4.5"
      stroke-linecap="round"
      opacity="0.8"
      fill="none"
    />

    <!-- G horizontal crossbar highlight -->
    <path
      d="M 368 254 L 442 254"
      stroke="url(#gAccent)"
      stroke-width="3.5"
      stroke-linecap="round"
      opacity="0.9"
      fill="none"
    />

    <!-- Inner central G vertical accent bar -->
    <path
      d="M 368 240 L 368 268"
      stroke="url(#gAccent)"
      stroke-width="3.5"
      stroke-linecap="round"
      opacity="0.8"
      fill="none"
    />
  </g>
</svg>
